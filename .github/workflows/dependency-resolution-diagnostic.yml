name: Isabella Genesis — Dependency Resolution Diagnostic

on:
  push:
    branches:
      - "repair/production-100"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"

jobs:
  resolve:
    name: Dependency resolution diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # 11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0 # 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Resolve without mutating lockfile
        id: resolve
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "registry=$(pnpm config get registry)"
            echo "--- package contract ---"
            node -e "const p=require('./package.json'); console.log(JSON.stringify({dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))"
            echo "--- lockfile resolution ---"
            pnpm install --lockfile-only --no-frozen-lockfile --reporter=append-only
          } 2>&1 | tee dependency-resolution.log
          exit ${PIPESTATUS[0]}

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4 # 65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: dependency-resolution-${{ github.run_id }}
          path: dependency-resolution.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish diagnostic failure
        if: steps.resolve.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Dependency resolution diagnostic"
            echo
            echo "- Commit: ${{ github.sha }}"
            echo "- Run: ${{ github.run_id }}"
            echo
            echo '```text'
            tail -n 220 dependency-resolution.log
            echo '```'
          } > diagnostic-issue.md
          gh issue create --title "CI diagnostic: dependency resolution failure (${{ github.run_id }})" --body-file diagnostic-issue.md || true

      - name: Repair lockfile on dedicated repair branch
        if: github.event_name == 'push' && github.ref_name == 'repair/production-100' && steps.resolve.outcome == 'success'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "ci: regenerate pnpm lockfile from package manifest"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Enforce diagnostic
        if: steps.resolve.outcome != 'success'
        run: exit 1
