name: Isabella Genesis — Dependency Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"

jobs:
  dependency-contract:
    name: Frozen dependency contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Print package contract
        run: |
          node --version
          pnpm --version
          node -e "const p=require('./package.json'); console.log(JSON.stringify({packageManager:p.packageManager,engines:p.engines},null,2))"

      - name: Verify package-lock contract
        run: pnpm verify:lock

      - name: Frozen install
        id: frozen-install
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --prefer-offline 2>&1 | tee dependency-install.log
          exit ${PIPESTATUS[0]}

      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v7 # 65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: dependency-contract-diagnostics-${{ github.run_id }}
          path: dependency-install.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Enforce frozen install
        if: steps.frozen-install.outcome != 'success'
        run: exit 1

      - name: Verify dependency tree
        run: pnpm list --depth 0
