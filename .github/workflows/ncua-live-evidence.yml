name: Isabella Genesis — Live NCUA Evidence

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed Isabella base URL"
        required: true
        type: string
      stages:
        description: "Comma-separated concurrency stages"
        required: false
        default: "50,100,250,500"
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"

jobs:
  live-ncua:
    name: Live NCUA 50→500 evidence
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Run live NCUA evidence
        env:
          NCUA_LIVE_BASE_URL: ${{ inputs.base_url }}
          NCUA_AUTHORIZATION: ${{ secrets.NCUA_AUTHORIZATION }}
          NCUA_STAGES: ${{ inputs.stages }}
        run: node scripts/ncua-live-load.mjs | tee ncua-live-evidence.jsonl

      - name: Upload NCUA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ncua-live-evidence-${{ github.run_id }}
          path: ncua-live-evidence.jsonl
          retention-days: 30
          if-no-files-found: error
