name: Production Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  env-check:
    name: Validate production contract
    runs-on: ubuntu-latest
    steps:
      - name: Validate required production variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          ISABELLA_STORAGE_PROVIDER: ${{ secrets.ISABELLA_STORAGE_PROVIDER }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}
          CROWN_POLICY_SIGNING_KEY: ${{ secrets.CROWN_POLICY_SIGNING_KEY }}
          AEGIS_AUDIT_SECRET: ${{ secrets.AEGIS_AUDIT_SECRET }}
          FEDERATION_SIGNING_KEYS_JSON: ${{ secrets.FEDERATION_SIGNING_KEYS_JSON }}
          BOOKPI_SIGNING_KEY: ${{ secrets.BOOKPI_SIGNING_KEY }}
          X402_PAYMENT_VAULT_ADDRESS: ${{ secrets.X402_PAYMENT_VAULT_ADDRESS }}
          ISABELLA_RUNTIME_MODE: ${{ secrets.ISABELLA_RUNTIME_MODE }}
          PROVISION_OWNER_TOKEN: ${{ secrets.PROVISION_OWNER_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          REQUIRED_VARS=(
            DATABASE_URL
            PUBLIC_URL
            ISABELLA_RUNTIME_MODE
            ISABELLA_STORAGE_PROVIDER
            AUTH_JWT_SECRET
            ENCRYPTION_MASTER_KEY
            CROWN_POLICY_SIGNING_KEY
            AEGIS_AUDIT_SECRET
            BOOKPI_SIGNING_KEY
            FEDERATION_SIGNING_KEYS_JSON
            X402_PAYMENT_VAULT_ADDRESS
            PROVISION_OWNER_TOKEN
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
          )
          missing=0
          for name in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing production secret/variable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Production environment contract satisfied: ${#REQUIRED_VARS[@]} variables present."

  verify:
    name: Re-run canonical production gate
    needs: env-check
    uses: ./.github/workflows/fgais-gate.yml
    permissions:
      contents: read

  release:
    name: Build and publish release
    needs: [env-check, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Validate Nitro output
        run: |
          set -euo pipefail
          test -d .output
          test -f .output/server/index.mjs
          find .output -type f -print0 | sort -z | xargs -0 sha256sum > release-sha256.txt

      - name: Generate SBOM (CycloneDX)
        run: pnpm sbom

      - name: Package immutable release artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -czf "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz" .output package.json pnpm-lock.yaml sbom.json
          sha256sum "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz" > "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz.sha256"
          cp release-sha256.txt "artifacts/release-output-sha256.txt"
          cp sbom.json "artifacts/sbom.json"

      - name: Verify semantic release version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -e 'process.stdout.write(require("./package.json").version)')"
          TAG_VERSION="${RELEASE_TAG#v}"
          test "$PKG_VERSION" = "$TAG_VERSION"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign release artifact (keyless Sigstore)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz.sig" \
            --bundle "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz.sigstore.json" \
            "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz"

      - name: Verify release artifact signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign verify-blob \
            --signature "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz.sig" \
            --bundle "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz.sigstore.json" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*@refs/tags/${RELEASE_TAG}$" \
            "artifacts/isabella-gateway-${RELEASE_TAG}.tar.gz"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/isabella-gateway-${{ github.ref_name }}.tar.gz

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/*
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
