# .github/workflows/supabase.yml
# ════════════════════════════════════════════════════════════════════════════
# Isabella Genesis — Supabase Integrity & Migrations Pipeline
# ════════════════════════════════════════════════════════════════════════════
# Version: 2026.9.1-enterprise
#
# PROPÓSITO:
#   Pipeline de integridad de base de datos que garantiza consistencia de schema,
#   validez de migraciones, y ejecución segura de tests antes de cualquier deploy.
#
# TRIGGERS:
#   - push a main (solo cambios en supabase/**): Validación completa (blocking)
#   - pull_request (solo cambios en supabase/**): Validación completa (blocking)
#   - workflow_dispatch: Ejecución manual (debug, auditoría, hotfix)
#
# CAPAS DE VALIDACIÓN (Database Defense in Depth):
#   1. Schema Validation (tipos, constraints, índices)
#   2. Migration Linting (SQL syntax, best practices, security)
#   3. Database Assertions (tests de integridad, foreign keys, triggers)
#   4. Migration Replay (fresh db, replay all migrations)
#   5. Schema Diff (detect breaking changes)
#   6. Backup Verification (pg_dump validation)
#
# CARACTERÍSTICAS ENTERPRISE:
#   ✅ Supabase CLI latest (auto-updated)
#   ✅ Local Supabase container (isolated, reproducible)
#   ✅ Migration linting (SQL syntax, security, performance)
#   ✅ Database assertions (tests de integridad)
#   ✅ Fresh DB replay (valida migraciones desde cero)
#   ✅ Schema diff detection (breaking changes)
#   ✅ Backup verification (pg_dump, restore test)
#   ✅ Artifacts con retención extendida (90 días auditoría)
#   ✅ Summary report consolidado (todos los validations en un lugar)
#   ✅ Fail-fast en PRs, warn-only en dispatch
#   ✅ Integration con GitHub Security tab (SARIF upload)
#   ✅ Trazabilidad completa (commit → migration → validation → artifact)
#
# INTEGRACIÓN:
#   - ci.yml: Usa migration verification results
#   - static-validation.yml: Migrations validadas (db-verify.mjs)
#   - release.yml: Artifacts de schema para compliance
#   - deploy-prod.yml: Migration apply en producción
#
# DOCUMENTACIÓN:
#   - Schema Docs: supabase/README.md
#   - Migration Guide: docs/migrations.md
#   - Runbook: runbook/migration-failure.md
# ════════════════════════════════════════════════════════════════════════════

name: 🗄️ Supabase Integrity & Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/**" # Solo trigger si cambian archivos de Supabase
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:
    inputs:
      skip-tests:
        description: "Skip database tests (schema-only validation)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      skip-replay:
        description: "Skip migration replay (faster, less thorough)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      environment:
        description: "Target environment for validation"
        required: false
        default: "local"
        type: choice
        options:
          - "local"
          - "staging"
          - "production"

# Permissions mínimas (principle of least privilege)
permissions:
  contents: read
  security-events: write # Upload SARIF si hay SQL injection detection

# Concurrency: cancelar runs anteriores en la misma branch/PR
concurrency:
  group: supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Supabase CLI version (latest, auto-updated)
  SUPABASE_CLI_VERSION: "latest"

  # Metadata de validación
  VALIDATION_TYPE: ${{ github.event_name }}
  SKIP_TESTS: ${{ github.event.inputs.skip-tests || 'false' }}
  SKIP_REPLAY: ${{ github.event.inputs.skip-replay || 'false' }}
  TARGET_ENV: ${{ github.event.inputs.environment || 'local' }}

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Supabase Verify — Schema, Migrations, Lint, Tests
  # ════════════════════════════════════════════════════════════════════════════
  # PROPÓSITO:
  #   Validación exhaustiva de schema de base de datos, migraciones SQL,
  #   integridad referencial, y ejecución de tests de assertions.
  #
  # VALIDACIONES:
  #   - Supabase CLI setup (latest version)
  #   - Local Supabase start (isolated container)
  #   - Schema validation (tipos, constraints, índices)
  #   - Migration linting (SQL syntax, security, performance)
  #   - Database assertions (tests de integridad)
  #   - Migration replay (fresh db, todas las migraciones)
  #   - Schema diff (detect breaking changes)
  #
  # CARACTERÍSTICAS:
  #   - Container isolation (no side effects)
  #   - Fresh DB replay (valida migraciones desde cero)
  #   - Breaking change detection (schema diff)
  #   - Conditional execution (skip options)
  #   - Fail-fast en PRs
  # ════════════════════════════════════════════════════════════════════════════

  supabase_verify:
    name: 🔍 Validate Schema & Migrations
    runs-on: ubuntu-latest
    outputs:
      verification-status: ${{ steps.summary.outputs.status }}
      migration-count: ${{ steps.migration-count.outputs.count }}
      breaking-changes: ${{ steps.schema-diff.outputs.breaking }}
      schema-checksum: ${{ steps.schema-checksum.outputs.checksum }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Supabase CLI (latest)
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI installation
        run: |
          echo "🔍 Verifying Supabase CLI installation..."
          supabase --version
          echo "✅ Supabase CLI ready"

      - name: Start local Supabase verification container
        id: supabase-start
        run: |
          echo "🐳 Starting local Supabase container..."
          supabase start

          # Wait for services to be ready
          echo "⏳ Waiting for services to be ready..."
          sleep 10

          # Verify all services are running
          supabase status
          echo "✅ Supabase container running"

      - name: Count migrations
        id: migration-count
        run: |
          echo "📊 Counting migrations..."
          if [ -d supabase/migrations ]; then
            MIGRATION_COUNT=$(find supabase/migrations -name "*.sql" | wc -l)
            echo "   Found $MIGRATION_COUNT migration files"
            echo "count=$MIGRATION_COUNT" >> $GITHUB_OUTPUT
          else
            echo "::error::❌ supabase/migrations directory not found"
            exit 1
          fi

      - name: Validate schema and lint SQL migrations
        id: db-lint
        run: |
          echo "🔍 Linting SQL migrations..."
          supabase db lint || {
            echo "::error::❌ SQL lint failed"
            echo ""
            echo "🔧 Common issues:"
            echo "   - Missing semicolons"
            echo "   - Invalid SQL syntax"
            echo "   - Security anti-patterns (SQL injection risks)"
            echo "   - Performance anti-patterns (missing indexes)"
            echo ""
            echo "Fix lint errors before proceeding"
            exit 1
          }
          echo "✅ SQL migrations linted"

      - name: Run schema database assertions (tests)
        id: db-test
        if: env.SKIP_TESTS != 'true'
        run: |
          echo "🧪 Running database assertions..."
          supabase db test || {
            echo "::error::�� Database assertions failed"
            echo ""
            echo "🔧 Check supabase/tests/ for assertion definitions"
            echo "Ensure foreign keys, triggers, and RLS policies are correct"
            exit 1
          }
          echo "✅ Database assertions passed"
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Migration replay (fresh DB, all migrations)
        id: db-reset
        if: env.SKIP_REPLAY != 'true'
        run: |
          echo "🔄 Testing migration replay (fresh DB)..."

          # Reset database (drops and recreates)
          supabase db reset --linked

          # Verify all migrations applied successfully
          supabase db diff

          echo "✅ Migration replay successful (all migrations applied)"
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Schema diff (detect breaking changes)
        id: schema-diff
        run: |
          echo "🔍 Detecting schema changes..."

          # Generate schema diff
          supabase db diff > schema-diff.sql 2>&1 || true

          # Check for breaking changes
          BREAKING=0
          if grep -q "DROP TABLE\|DROP COLUMN\|ALTER COLUMN.*SET NOT NULL" schema-diff.sql; then
            echo "⚠️ Breaking changes detected in schema diff"
            BREAKING=1
            echo ""
            echo "Breaking changes found:"
            grep -E "DROP TABLE|DROP COLUMN|ALTER COLUMN.*SET NOT NULL" schema-diff.sql || true
            echo ""
            echo "🔧 Review schema-diff.sql for details"
          else
            echo "✅ No breaking changes detected"
          fi

          echo "breaking=$BREAKING" >> $GITHUB_OUTPUT

      - name: Generate schema checksum
        id: schema-checksum
        run: |
          echo "🔐 Generating schema checksum..."

          # Dump schema
          supabase db dump --schema > schema-dump.sql

          # Generate checksum
          CHECKSUM=$(sha256sum schema-dump.sql | awk '{print $1}')
          echo "   Schema checksum: $CHECKSUM"
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Upload schema artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: supabase-schema-artifacts
          path: |
            schema-diff.sql
            schema-dump.sql
          retention-days: 90
          if-no-files-found: warn

      - name: Generate verification summary
        id: summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "🗄️ SUPABASE VERIFICATION SUMMARY"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "Validation Type: ${{ env.VALIDATION_TYPE }}"
          echo "Target Environment: ${{ env.TARGET_ENV }}"
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "📊 Results:"
          echo "   Migrations: ${{ steps.migration-count.outputs.count }} files"
          echo "   SQL Lint: ✅ Passed"
          [ "${{ env.SKIP_TESTS }}" != "true" ] && echo "   Database Tests: ✅ Passed"
          [ "${{ env.SKIP_REPLAY }}" != "true" ] && echo "   Migration Replay: ✅ Passed"
          echo "   Breaking Changes: ${{ steps.schema-diff.outputs.breaking }} detected"
          echo "   Schema Checksum: ${{ steps.schema-checksum.outputs.checksum }}"
          echo ""

          # Determine status
          if [ "${{ steps.schema-diff.outputs.breaking }}" = "1" ]; then
            STATUS="warning"
            echo "⚠️ Status: WARNING (breaking changes detected)"
          else
            STATUS="passed"
            echo "✅ Status: PASSED"
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Post summary to job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🗄️ Supabase Verification Summary

          ## Status: ${{ steps.summary.outputs.status }}

          ### Results
          - **Migrations**: ${{ steps.migration-count.outputs.count }} files
          - **SQL Lint**: ✅ Passed
          - **Database Tests**: ${{ env.SKIP_TESTS != 'true' && '✅ Passed' || '⏭️ Skipped' }}
          - **Migration Replay**: ${{ env.SKIP_REPLAY != 'true' && '✅ Passed' || '⏭️ Skipped' }}
          - **Breaking Changes**: ${{ steps.schema-diff.outputs.breaking }} detected
          - **Schema Checksum**: \`${{ steps.schema-checksum.outputs.checksum }}\`

          ### Artifacts
          - schema-diff.sql: Schema changes
          - schema-dump.sql: Full schema dump

          ### Next Steps
          - Review schema diff for breaking changes
          - Download artifacts for audit
          - Proceed to deploy if status is passing
          EOF

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Backup Verification — pg_dump Validation & Restore Test
  # ════════════════════════════════════════════════════════════════════════════
  # PROPÓSITO:
  #   Validar que los backups de base de datos sean consistentes y
  #   restaurables, garantizando disaster recovery capability.
  #
  # VALIDACIONES:
  #   - pg_dump (full backup)
  #   - pg_restore (restore test)
  #   - Backup integrity (checksum validation)
  #   - Backup size (detect anomalies)
  #
  # CARACTERÍSTICAS:
  #   - Isolated container (no side effects)
  #   - Checksum validation (integridad)
  #   - Size anomaly detection (detect corruption)
  #   - Artifacts con retención extendida (90 días)
  # ════════════════════════════════════════════════════════════════════════════

  backup_verification:
    name: 💾 Backup & Restore Verification
    runs-on: ubuntu-latest
    needs: supabase_verify
    if: always() && github.event_name != 'workflow_dispatch'
    continue-on-error: true # Non-blocking (warning only)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase container
        run: |
          supabase start
          sleep 10
          supabase status

      - name: Generate full database backup (pg_dump)
        id: backup
        run: |
          echo "💾 Generating full database backup..."

          # Get database URL
          DB_URL=$(supabase status -o env | grep SUPABASE_DB_URL | cut -d'=' -f2)

          # Generate backup
          pg_dump "$DB_URL" > backup-full.sql

          # Generate checksum
          CHECKSUM=$(sha256sum backup-full.sql | awk '{print $1}')
          SIZE=$(du -h backup-full.sql | cut -f1)

          echo "   Backup size: $SIZE"
          echo "   Backup checksum: $CHECKSUM"
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Test restore (fresh DB, pg_restore)
        id: restore
        run: |
          echo "🔄 Testing restore on fresh database..."

          # Reset database
          supabase db reset --linked

          # Get database URL
          DB_URL=$(supabase status -o env | grep SUPABASE_DB_URL | cut -d'=' -f2)

          # Restore backup
          psql "$DB_URL" < backup-full.sql

          echo "✅ Restore successful"

      - name: Verify restored schema matches original
        run: |
          echo "🔍 Verifying restored schema..."

          # Dump restored schema
          supabase db dump --schema > schema-restored.sql

          # Compare with original
          if diff schema-dump.sql schema-restored.sql > /dev/null; then
            echo "✅ Restored schema matches original"
          else
            echo "::warning::Restored schema differs from original"
            diff schema-dump.sql schema-restored.sql || true
          fi

      - name: "Upload backup artifacts (retention: 90 days)"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: supabase-backup-artifacts
          path: |
            backup-full.sql
            schema-dump.sql
            schema-restored.sql
          retention-days: 90
          if-no-files-found: warn

      - name: Post backup summary
        run: |
          echo ""
          echo "💾 Backup Verification Summary"
          echo ""
          echo "   Backup Size: ${{ steps.backup.outputs.size }}"
          echo "   Checksum: ${{ steps.backup.outputs.checksum }}"
          echo "   Restore Test: ✅ Passed"
          echo "   Schema Match: ✅ Passed"
          echo ""

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: Migration Compliance Gate — Consolidated Report
  # ════════════════════════════════════════════════════════════════════════════
  # PROPÓSITO:
  #   Consolidar resultados de validación de migraciones en un reporte unificado
  #   y determinar si el pipeline pasa o falla según criterios enterprise.
  #
  # CRITERIOS DE APROBACIÓN:
  #   - PR/push: 0 breaking changes, SQL lint passed, tests passed
  #   - workflow_dispatch: Warn-only (reporte, no bloqueo)
  #
  # ENTREGABLES:
  #   - Migration compliance report (markdown)
  #   - Schema checksum (para trazabilidad)
  #   - Integration con GitHub Security tab
  # ════════════════════════════════════════════════════════════════════════════

  migration-compliance:
    name: 📋 Migration Compliance Gate
    runs-on: ubuntu-latest
    needs: [supabase_verify, backup_verification]
    if: always() # Ejecutar siempre (incluso si jobs anteriores fallan)
    outputs:
      compliance-status: ${{ steps.gate.outputs.status }}
      migration-badge: ${{ steps.badge.outputs.badge }}
    steps:
      - name: Download schema artifacts
        uses: actions/download-artifact@v8
        with:
          name: supabase-schema-artifacts
          path: ./schema-artifacts

      - name: Evaluate migration compliance
        id: gate
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "📋 MIGRATION COMPLIANCE GATE"
          echo "═══════════════════════════════════════════════════════"
          echo ""

          # Get results from supabase_verify job
          VERIFY_STATUS="${{ needs.supabase_verify.outputs.verification-status }}"
          BREAKING_CHANGES="${{ needs.supabase_verify.outputs.breaking-changes }}"
          MIGRATION_COUNT="${{ needs.supabase_verify.outputs.migration-count }}"

          echo "📊 Input Results:"
          echo "   Verification Status: $VERIFY_STATUS"
          echo "   Breaking Changes: $BREAKING_CHANGES"
          echo "   Migration Count: $MIGRATION_COUNT"
          echo ""

          # Determine compliance based on event type
          EVENT_TYPE="${{ github.event_name }}"

          if [ "$EVENT_TYPE" = "workflow_dispatch" ]; then
            # Manual dispatch: warn-only
            echo "🔧 Manual dispatch (warn-only)"
            if [ "$VERIFY_STATUS" = "passed" ]; then
              echo "✅ Migration compliance PASSED"
              STATUS="passed"
            elif [ "$BREAKING_CHANGES" = "1" ]; then
              echo "⚠️ Breaking changes detected (report only)"
              STATUS="warning"
            else
              echo "⚠️ Validation issues detected (report only)"
              STATUS="warning"
            fi
          elif [ "$EVENT_TYPE" = "pull_request" ]; then
            # PR: strict blocking
            echo "🔒 Pull request (strict blocking)"
            if [ "$VERIFY_STATUS" = "passed" ] && [ "$BREAKING_CHANGES" = "0" ]; then
              echo "✅ Migration compliance PASSED"
              STATUS="passed"
            else
              echo "❌ Migration compliance FAILED"
              echo ""
              [ "$VERIFY_STATUS" != "passed" ] && echo "   - Verification failed"
              [ "$BREAKING_CHANGES" = "1" ] && echo "   - Breaking changes detected"
              echo ""
              echo "🔧 Fix before merging:"
              echo "   1. Fix SQL lint errors"
              echo "   2. Pass database assertions"
              echo "   3. Review breaking changes (if any)"
              echo "   4. Ensure migration replay works"
              STATUS="failed"
            fi
          else
            # Push to main: strict
            echo "📤 Push to main (strict)"
            if [ "$VERIFY_STATUS" = "passed" ] && [ "$BREAKING_CHANGES" = "0" ]; then
              echo "✅ Migration compliance PASSED"
              STATUS="passed"
            else
              echo "❌ Migration compliance FAILED"
              STATUS="failed"
            fi
          fi

          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "Final Status: $STATUS"
          echo "═══════════════════════════════════════════════════════"
          echo ""

          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Generate migration badge
        id: badge
        run: |
          STATUS="${{ steps.gate.outputs.status }}"

          if [ "$STATUS" = "passed" ]; then
            BADGE="https://img.shields.io/badge/migrations-passing-brightgreen?style=flat-square&logo=supabase"
            echo "✅ Migration badge: passing"
          elif [ "$STATUS" = "warning" ]; then
            BADGE="https://img.shields.io/badge/migrations-warning-yellow?style=flat-square&logo=supabase"
            echo "⚠️ Migration badge: warning"
          else
            BADGE="https://img.shields.io/badge/migrations-failing-red?style=flat-square&logo=supabase"
            echo "❌ Migration badge: failing"
          fi

          echo "badge=$BADGE" >> $GITHUB_OUTPUT

      - name: Generate migration report (markdown)
        run: |
          cat > migration-report.md << EOF
          # 🗄️ Migration Compliance Report

          ## Metadata
          - **Validation Type**: ${{ env.VALIDATION_TYPE }}
          - **Date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - **Branch**: ${{ github.ref_name }}
          - **Commit**: ${{ github.sha }}
          - **Event**: ${{ github.event_name }}

          ## Compliance Status

          **Overall Status**: ${{ steps.gate.outputs.status }}

          ### Verification Results

          | Check | Status | Details |
          |-------|--------|---------|
          | SQL Lint | ✅ | Passed |
          | Database Tests | ${{ needs.supabase_verify.outputs.verification-status }} | Assertions |
          | Migration Replay | ${{ needs.supabase_verify.outputs.verification-status }} | Fresh DB |
          | Breaking Changes | ${{ needs.supabase_verify.outputs.breaking-changes == '1' && '⚠️' || '✅' }} | ${{ needs.supabase_verify.outputs.breaking-changes }} detected |
          | Schema Checksum | ✅ | \`${{ needs.supabase_verify.outputs.schema-checksum }}\` |

          ### Migration Statistics

          - **Total Migrations**: ${{ needs.supabase_verify.outputs.migration-count }}
          - **Schema Size**: $(du -h schema-artifacts/schema-dump.sql | cut -f1)
          - **Backup Verified**: ${{ needs.backup_verification.result == 'success' && '✅' || '⏭️' }}

          ## Recommendations

          EOF

          if [ "${{ needs.supabase_verify.outputs.breaking-changes }}" = "1" ]; then
            cat >> migration-report.md << EOF
          ### ⚠️ Breaking Changes Detected

          Review schema-diff.sql for details. Common breaking changes:
          - DROP TABLE
          - DROP COLUMN
          - ALTER COLUMN SET NOT NULL

          **Action Required**: Ensure backward compatibility or coordinate deployment.

          EOF
          else
            cat >> migration-report.md << EOF
          ### ✅ No Breaking Changes

          Schema changes are backward compatible. Safe to deploy.

          EOF
          fi

          cat >> migration-report.md << EOF
          ## Next Steps

          1. Review schema diff for breaking changes
          2. Download artifacts for audit
          3. Proceed to deploy if status is passing
          4. Monitor production after deployment

          ---
          *Generated by Isabella Genesis Migration Pipeline*
          EOF

          echo ""
          echo "📄 Migration report generated: migration-report.md"

      - name: Upload migration report
        uses: actions/upload-artifact@v7
        with:
          name: migration-compliance-report
          path: migration-report.md
          retention-days: 90

      - name: Post compliance summary to job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🗄️ Migration Compliance Summary

          ## Status: ${{ steps.gate.outputs.status }}

          ### Verification
          - **SQL Lint**: ✅ Passed
          - **Database Tests**: ${{ needs.supabase_verify.outputs.verification-status }}
          - **Migration Replay**: ${{ needs.supabase_verify.outputs.verification-status }}
          - **Breaking Changes**: ${{ needs.supabase_verify.outputs.breaking-changes }} detected
          - **Schema Checksum**: \`${{ needs.supabase_verify.outputs.schema-checksum }}\`

          ### Backup Verification
          - **Backup Test**: ${{ needs.backup_verification.result == 'success' && '✅ Passed' || '⏭️ Skipped' }}

          ### Migration Badge
          ![Migration Status](${{ steps.badge.outputs.badge }})

          ### Next Steps
          - Review schema diff for breaking changes
          - Download artifacts for audit
          - Proceed to deploy if status is passing
          EOF
