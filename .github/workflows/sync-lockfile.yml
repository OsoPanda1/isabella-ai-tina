name: Sync pnpm lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

concurrency:
  group: sync-pnpm-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: "github.event.head_commit.message != 'chore: sync pnpm lockfile'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify frozen lockfile before commit
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name 'TAMV ONLINE ENTERPRISE'
          git config user.email '120252809+OsoPanda1@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git commit -m 'chore: sync pnpm lockfile'
          git push
