name: FGAIS Production Gate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.34.5"
  SANITIZE_STRICT: "true"

jobs:
  verify:
    name: FGAIS Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify toolchain pins
        run: |
          test "$(node --version)" = "v24.11.0"
          test "$(pnpm --version)" = "10.34.5"
          test "$(cat .nvmrc | tr -d '\\r\\n')" = "24.11.0"
          node -e 'const p=require("./package.json"); if(p.packageManager!=="pnpm@10.34.5") process.exit(1); if(p.engines?.node!=="24.x") process.exit(1)'

      - name: Verify package-lock contract
        run: pnpm verify:lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Repository hygiene
        run: node scripts/sanitize-repo.mjs

      - name: Security scan
        run: pnpm security:scan

      - name: Capability contract
        run: pnpm capabilities

      - name: Route contract
        run: pnpm audit:routes

      - name: Migration verification
        run: pnpm db:verify

      - name: Production integrity gate
        run: pnpm production:integrity

      - name: Production preflight
        run: pnpm production:preflight -- --json

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Validate Vercel/Nitro output
        run: |
          test -f .vercel/output/config.json || test -d .output || test -d dist

      - name: Runtime smoke (opt-in)
        if: vars.RUNTIME_SMOKE_URL != ''
        env:
          RUNTIME_SMOKE_URL: ${{ vars.RUNTIME_SMOKE_URL }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            "$RUNTIME_SMOKE_URL/api/health/ready"

      - name: Build evidence
        run: |
          if test -d .vercel/output; then ROOT=.vercel/output;
          elif test -d .output; then ROOT=.output;
          else ROOT=dist; fi
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > build-sha256.txt

      - name: Generate evidence bundle
        run: pnpm production:evidence

      - name: Generate SBOM (CycloneDX)
        run: pnpm sbom

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isabella-build-${{ github.sha }}
          path: |
            build-sha256.txt
            sbom.json
            release/
          retention-days: 30
