spring:
  application:
    name: isabella-jdr
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:}
          audiences: ${OIDC_AUDIENCE:}
  datasource:
    url: ${JDR_DB_URL:jdbc:mysql://localhost:3306/isabella_jdr}
    username: ${JDR_DB_USERNAME:isabella_jdr}
    password: ${JDR_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: isabella-jdr

jdr:
  rate-limit:
    capacity: 30
    refill-seconds: 10
  outbox:
    poll-millis: 2000
    batch-size: 100
  quantum:
    default-wires: 32
    max-wires: 64
    default-shots: 1024
    max-shots: 8192
    max-operations: 2000
    timeout-seconds: 30
  external:
    connect-timeout-millis: 800
    read-timeout-millis: 2000
    overall-timeout-seconds: 5
