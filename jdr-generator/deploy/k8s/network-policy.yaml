apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isabella-jdr-deny-all
spec:
  podSelector:
    matchLabels:
      app: isabella-jdr
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: isabella-authz-gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mysql
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
